name: assetkeeper
description: Equipment and furniture inventory and accountability management.
publish_to: 'none'
version: 1.0.4+5

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  cryptography: ^2.9.0
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^3.9.1
  sqflite_common: ^2.5.13
  sqflite_common_ffi: ^2.4.7
  sqflite_common_ffi_web: ^1.2.0
  window_manager: ^0.5.2
  http: ^1.6.0
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.2
  pub_semver: ^2.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/migrations/001_initial.sql
    - assets/branding/
    - third_party/licenses/

hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
