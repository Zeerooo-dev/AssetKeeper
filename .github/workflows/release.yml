name: Build and release AssetKeeper

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assetkeeper-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python3 tool/release.py verify
      - run: python3 -m unittest discover -s tool -p 'test_*.py'
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-24.04
          - platform: linux
            os: ubuntu-24.04
          - platform: windows
            os: windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Install Linux build libraries
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libjsoncpp-dev
      - run: flutter pub get
      - name: Restore private Android signing key
        if: matrix.platform == 'android'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: python3 tool/release.py signing
      - name: Build APK
        if: matrix.platform == 'android'
        run: flutter build apk --release
      - name: Build Linux
        if: matrix.platform == 'linux'
        run: flutter build linux --release
      - name: Build Windows
        if: matrix.platform == 'windows'
        run: flutter build windows --release
      - name: Package complete application
        run: python tool/release.py package ${{ matrix.platform }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AssetKeeper-${{ matrix.platform }}
          path: build/release/*
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing files
        if: always() && matrix.platform == 'android'
        run: rm -f android/key.properties .private/release.jks

  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: build/release
          merge-multiple: true
      - name: Publish only a new complete version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 tool/release.py publish
